<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><title>Create account</title><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f6f7f9" stroke="none"/><rect x="0" y="0" width="512" height="900" rx="0" fill="#173e3b" stroke="none"/><text x="48" y="68" font-family="Arial, sans-serif" font-size="24" fill="#fff" font-weight="700">CAMPUS DESK</text><text x="48" y="310" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="700">Campus services,</text><text x="48" y="362" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="700">simplified.</text><text x="48" y="422" font-family="Arial, sans-serif" font-size="17" fill="#d6e3de" font-weight="400">Transcripts, student ID cards, IT help and more.</text><text x="48" y="452" font-family="Arial, sans-serif" font-size="17" fill="#d6e3de" font-weight="400">One place to ask, one place to follow up.</text><text x="48" y="808" font-family="Arial, sans-serif" font-size="14" fill="#bfd3cb" font-weight="400">Built around your campus day.</text><text x="650" y="186" font-family="Arial, sans-serif" font-size="34" fill="#172c35" font-weight="700">Create your account</text><text x="650" y="222" font-family="Arial, sans-serif" font-size="16" fill="#63757b" font-weight="400">Start requesting campus services.</text><text x="650" y="278" font-family="Arial, sans-serif" font-size="14" fill="#172c35" font-weight="700">Full name</text><rect x="650" y="290" width="492" height="46" rx="6" fill="#fff" stroke="#dce5e3"/><text x="664" y="319" font-family="Arial, sans-serif" font-size="14" fill="#172c35" font-weight="400">Alex Morgan</text><text x="650" y="370" font-family="Arial, sans-serif" font-size="14" fill="#172c35" font-weight="700">Email address</text><rect x="650" y="382" width="492" height="46" rx="6" fill="#fff" stroke="#dce5e3"/><text x="664" y="411" font-family="Arial, sans-serif" font-size="14" fill="#172c35" font-weight="400">alex@example.edu</text><text x="650" y="462" font-family="Arial, sans-serif" font-size="14" fill="#172c35" font-weight="700">Password</text><rect x="650" y="474" width="492" height="46" rx="6" fill="#fff" stroke="#dce5e3"/><text x="664" y="503" font-family="Arial, sans-serif" font-size="14" fill="#172c35" font-weight="400">••••••••••••</text><text x="650" y="542" font-family="Arial, sans-serif" font-size="13" fill="#63757b" font-weight="400">Use 12 to 128 characters.</text><rect x="650" y="574" width="492" height="44" rx="7" fill="#1d6257" stroke="none"/><text x="666" y="602" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">Create account</text><text x="650" y="654" font-family="Arial, sans-serif" font-size="14" fill="#63757b" font-weight="400">Already have an account?</text><text x="835" y="654" font-family="Arial, sans-serif" font-size="14" fill="#1d6257" font-weight="700">Log in</text><text x="650" y="692" font-family="Arial, sans-serif" font-size="13" fill="#63757b" font-weight="400">New accounts are students. Staff accounts are provisioned separately.</text></svg>